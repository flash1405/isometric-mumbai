<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- pixel-art Gateway of India on the harbour -->
  <rect width="32" height="32" rx="7" fill="#0d1220"/>
  <rect x="2" y="26" width="28" height="4" fill="#1b6b7d"/>
  <rect x="4" y="27" width="3" height="1" fill="#3fa3b5"/><rect x="20" y="28" width="4" height="1" fill="#3fa3b5"/>
  <!-- plaza -->
  <rect x="5" y="24" width="22" height="2" fill="#b58a52"/>
  <!-- body -->
  <rect x="7" y="12" width="18" height="12" fill="#f2c25c"/>
  <rect x="21" y="12" width="4" height="12" fill="#cf9a3c"/>
  <!-- turrets + domes -->
  <rect x="7" y="8" width="4" height="4" fill="#f2c25c"/><rect x="21" y="8" width="4" height="4" fill="#cf9a3c"/>
  <rect x="8" y="6" width="2" height="2" fill="#f7d98a"/><rect x="22" y="6" width="2" height="2" fill="#e0b25a"/>
  <rect x="13" y="9" width="2" height="3" fill="#f2c25c"/><rect x="17" y="9" width="2" height="3" fill="#f2c25c"/>
  <rect x="13" y="8" width="2" height="1" fill="#f7d98a"/><rect x="17" y="8" width="2" height="1" fill="#f7d98a"/>
  <!-- parapet -->
  <rect x="7" y="12" width="18" height="1" fill="#f7d98a"/>
  <!-- central arch + side arches -->
  <rect x="13" y="16" width="6" height="8" fill="#3b2a1a"/><rect x="14" y="15" width="4" height="1" fill="#3b2a1a"/>
  <rect x="8" y="18" width="3" height="6" fill="#5a4026"/><rect x="21" y="18" width="3" height="6" fill="#4a3420"/>
</svg>
