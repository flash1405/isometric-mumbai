# ai-toolkit config: FLUX.2 [klein] 4B edit LoRA (v2 student, Apache 2.0 base). Unquantised bf16 for big GPUs.
# Placeholders (out_dir, dataset, prompt, holdout_a/b) are filled in by `pipeline/lambda_gpu.py train`.
job: extension
config:
  name: "isometric-mumbai-klein-v2-b200"
  process:
    - type: "sd_trainer"
      training_folder: "{out_dir}"
      device: cuda:0
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 10
      datasets:
        - folder_path: "{dataset}/images"
          control_path: "{dataset}/control"
          caption_ext: "txt"
          caption_dropout_rate: 0.0 # one fixed prompt, embeddings cached
          resolution: [1024]
      train:
        batch_size: 1
        cache_text_embeddings: true
        steps: 2500
        gradient_accumulation: 1
        timestep_type: "weighted"
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        dtype: bf16
        skip_first_sample: true
      model:
        name_or_path: "black-forest-labs/FLUX.2-klein-base-4B"
        arch: "flux2_klein_4b"
        quantize: false
        low_vram: false
      sample:
        sampler: "flowmatch"
        sample_every: 500
        width: 1024
        height: 1024
        samples:
          - prompt: "{prompt}"
            ctrl_img: "{holdout_a}"
          - prompt: "{prompt}"
            ctrl_img: "{holdout_b}"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 4
        sample_steps: 30
meta:
  name: "[name]"
  version: "1.0"
